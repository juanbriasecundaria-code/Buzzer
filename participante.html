<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;800;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; }
  :root {
    --bg: #08080c;
    --bg-2: #0f0f16;
    --surface: #15151d;
    --surface2: #1c1c26;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f2f1ea;
    --muted: #8b8b96;
    --accent: #c8f060;
    --accent-dim: rgba(200,240,96,0.10);
    --accent-glow: rgba(200,240,96,0.35);
    --gold: #f5c842;
    --gold-dim: rgba(245,200,66,0.10);
    --silver: #a0b4c8;
    --silver-dim: rgba(160,180,200,0.12);
    --danger: #ff5f6b;
    --success: #4ecb7e;
    --info: #60b4f0;
    --info-dim: rgba(96,180,240,0.10);
    --info-glow: rgba(96,180,240,0.35);
    --radius: 10px;
    --radius-lg: 18px;
    --font-display: 'Orbitron', 'Segoe UI', sans-serif;
    --font-head: 'Rajdhani', -apple-system, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }
  html { background: var(--bg); }
  body {
    font-family: var(--font-body);
    background:
      radial-gradient(ellipse 700px 420px at 15% -8%, rgba(200,240,96,0.10), transparent 60%),
      radial-gradient(ellipse 600px 380px at 105% 8%, rgba(96,180,240,0.09), transparent 60%),
      radial-gradient(ellipse 900px 600px at 50% 110%, rgba(245,200,66,0.05), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    height: 100dvh;
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── layout raíz: paneles (Yo / En vivo) + barra de pestañas ── */
  #panels { flex: 1; min-height: 0; position: relative; }
  .panel { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  .panel.hidden { display: none; }
  #app, #vivo-app { max-width: 560px; margin: 0 auto; padding: 1.25rem 1rem 1.75rem; }

  .tabbar {
    display: flex; flex-shrink: 0; border-top: 1px solid var(--border2);
    background: rgba(15,15,22,0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar.hidden { display: none; }
  .tab-btn {
    flex: 1; background: none; border: none; color: var(--muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
    padding: 0.6rem 0 0.5rem; font-family: var(--font-head); font-size: 11px; font-weight: 700;
    letter-spacing: 0.03em; transition: color .15s;
  }
  .tab-btn .tab-ic { font-size: 19px; }
  .tab-btn.active { color: var(--accent); }
  .tab-btn.active .tab-ic { filter: drop-shadow(0 0 8px var(--accent-glow)); }

  /* ── selector de fase (En vivo) ── */
  .gh-seg { display: flex; background: var(--surface2); border: 1px solid var(--border2); border-radius: 12px; padding: 3px; margin-bottom: 1rem; }
  .gh-seg-btn { flex: 1; background: none; border: none; color: var(--muted); font-family: var(--font-head); font-size: 12.5px; font-weight: 700; padding: 0.55rem 0.4rem; border-radius: 9px; cursor: pointer; transition: background .15s, color .15s; }
  .gh-seg-btn.active { background: var(--accent-dim); color: var(--accent); }
  .gh-seg-btn.active.f2 { background: var(--info-dim); color: var(--info); }

  /* ── relator: cartel fijo con novedades automáticas ── */
  .gh-relator {
    display: flex; align-items: center; gap: 0.55rem;
    background: linear-gradient(180deg, var(--surface), var(--bg-2));
    border: 1px solid var(--border2); border-radius: var(--radius-lg);
    padding: 0.75rem 0.95rem; margin-bottom: 1rem; min-height: 44px;
    font-size: 12.5px; font-weight: 600; color: var(--text);
    position: relative; overflow: hidden;
  }
  .gh-relator::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity:.8; }
  .gh-relator-emoji { font-size: 17px; flex-shrink: 0; }
  .gh-relator-txt { flex: 1; transition: opacity .35s var(--ease); }
  .gh-relator-txt.fade { opacity: 0; }
  .gh-relator-txt b { color: var(--gold); }
  .gh-relator-empty { color: var(--muted); font-style: italic; }

  /* ── podio vertical (En vivo) ── */
  .gh-podium { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.9rem; }
  .gh-pod-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.65rem 0.8rem; border-radius: 12px; background: var(--surface2); border: 1px solid var(--border); }
  .gh-pod-row.p1 { border-color: rgba(245,200,66,0.45); background: var(--gold-dim); }
  .gh-pod-row.p2 { border-color: rgba(160,180,200,0.4); background: var(--silver-dim); }
  .gh-pod-row.p3 { border-color: rgba(205,127,50,0.4); background: var(--bronze-dim); }
  .gh-pod-medal { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
  .gh-pod-name { flex: 1; min-width: 0; font-family: var(--font-head); font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 0.55rem; }
  .gh-pod-pts { font-family: var(--font-display); font-weight: 800; font-size: 16px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .card.f2 .gh-pod-pts { color: var(--info); }

  /* ── barra de progreso de duelos jugados ── */
  .gh-progress-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-bottom: 0.4rem; }
  .gh-progress-label b { color: var(--text); }
  .gh-progress-bar { height: 8px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--border); overflow: hidden; }
  .gh-progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), #9fe066); transition: width .4s var(--ease); }
  .card.f2 .gh-progress-fill { background: linear-gradient(90deg, var(--info), #7fc4f5); }

  /* ── logros (En vivo) ── */
  .gh-logro-row { display: flex; align-items: flex-start; gap: 0.65rem; padding: 0.6rem 0.7rem; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); margin-bottom: 0.5rem; }
  .gh-logro-row:last-child { margin-bottom: 0; }
  .gh-logro-emoji { font-size: 20px; flex-shrink: 0; line-height: 1.3; }
  .gh-logro-text { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
  .gh-logro-title { font-family: var(--font-head); font-size: 13px; font-weight: 700; color: var(--gold); }
  .gh-logro-who { font-size: 12px; font-weight: 700; color: var(--text); }
  .gh-logro-desc { font-size: 11px; color: var(--muted); }

  #vivo-app .gh-empty, #vivo-app .gh-loading { text-align: center; }

  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* header */
  .gh-header { text-align: center; padding: 1.1rem 0 1.6rem; }
  .gh-avatar-wrap { display: flex; justify-content: center; margin-bottom: 0.7rem; }
  .gh-avatar-wrap .pa-img, .gh-avatar-wrap .pa-fallback { box-shadow: 0 0 0 3px var(--bg-2), 0 0 0 5px var(--accent-glow); }

  /* ── AVATARES (fotos de perfil publicadas desde velada.html) ── */
  .pa-img { border-radius: 50%; object-fit: cover; flex-shrink: 0; display: block; }
  .pa-fallback { border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--text); opacity: 0.92; }
  .pa-duo { display: inline-flex; align-items: center; flex-shrink: 0; }
  .pa-duo > *:nth-child(2) { margin-left: -8px; }
  .pa-duo > *:nth-child(1) { z-index: 1; position: relative; }
  .ranking-name { display: inline-flex; align-items: center; gap: 0.5rem; }
  .gh-eyebrow { font-family: var(--font-head); font-size: 11.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
  .gh-title { font-family: var(--font-head); font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: -0.01em; text-shadow: 0 0 24px var(--accent-glow); }

  /* selection grid */
  .gh-sel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; margin-top: 0.5rem; }
  .gh-sel-btn {
    background: linear-gradient(180deg, var(--surface), var(--surface2));
    border: 1px solid var(--border2);
    border-radius: var(--radius-lg);
    padding: 1.1rem 0.5rem;
    color: var(--text);
    font-family: var(--font-head);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    transition: border-color 0.18s var(--ease), background 0.18s var(--ease), transform 0.18s var(--ease), box-shadow .18s var(--ease);
  }
  .gh-sel-btn .pa-img, .gh-sel-btn .pa-fallback { box-shadow: 0 0 0 2px var(--bg-2), 0 0 0 4px rgba(255,255,255,0.06); }
  .gh-sel-btn:hover .pa-img, .gh-sel-btn:hover .pa-fallback { box-shadow: 0 0 0 2px var(--bg-2), 0 0 0 4px var(--accent-glow); }
  .gh-sel-btn:hover { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 20px -8px rgba(200,240,96,0.35); }

const firebaseConfig = {

};
const app = initializeApp(firebaseConfig, 'guest');
const db  = getFirestore(app);

// ── Roster / fixtures por defecto (se pisan si el organizador editó el roster) ──
const PLAYERS_DEFAULT = ['Risu','Totti','Thiago','Valentín','Laza','Lara','Martin','Cori','Flor','Tomás'];
const TEAMS_DEFAULT = [
  'Martín H. / Valentín A.',
  'Lázaro G. / Tomás P.',
  'Thiago C. / Lara M.',
  'Totti / Risu',
  'Coral O. / Florencia L.'
];
const FULL_NAMES = {
  'Risu':'Risu','Totti':'Totti','Thiago':'Thiago C.','Mica':'Micaela B.','Valentín':'Valentín A.',
  'Laza':'Lázaro G.','Lara':'Lara M.','Martin':'Martín H.','Cori':'Coral O.','Flor':'Florencia L.','Tomás':'Tomás P.'
};
const GAMES_F1_DEFAULT = ['Curling','100 Argentinos Dicen','UNO','Palabras a Tiempo','Carrera de Mentes','Spot It'];
const GAMES_F2_DEFAULT = ['Mario Party',"Time's Up",'Beer Pong','Guess Movie/Song','El Erudito','Jenga'];

// F1_FIXTURE / F2_FIXTURE: [ronda, idxA, idxB, idxJuego] — se recalcula el de F1
// si cambia la cantidad de jugadores (mismo algoritmo round-robin que la app principal).
function generateF1Fixture(n) {
  const rounds = n % 2 === 0 ? n - 1 : n;
  const hasBye = n % 2 !== 0;
  const arr = Array.from({length: n}, (_, i) => i);
  if (hasBye) arr.push(-1);
  const total = arr.length;
  const fixture = [];
  const gamesCount = GAMES_F1_DEFAULT.length;
  let gamePtr = 0;
  for (let r = 0; r < rounds; r++) {
    for (let i = 0; i < total / 2; i++) {
      const a = arr[i], b = arr[total - 1 - i];
      if (a !== -1 && b !== -1) { fixture.push([r + 1, a, b, gamePtr % gamesCount]); gamePtr++; }
    }
    const fixed = arr[0];
    const rest = arr.slice(1);
    rest.unshift(rest.pop());
    arr.splice(0, arr.length, fixed, ...rest);
  }
  return fixture;
}
const F2_FIXTURE_DEFAULT = [
  [1,0,1,0],[1,2,3,4],[1,4,5,2],
  [2,0,4,5],[2,2,3,3],[2,1,5,1],
  [3,2,4,0],[3,0,5,4],[3,1,3,2],
  [4,0,1,3],[4,3,4,1],[4,2,5,5],
  [5,3,5,0],[5,1,4,4],[5,0,2,2],
  [6,0,2,1],[6,1,3,5],[6,4,5,3],
];

let PLAYERS = PLAYERS_DEFAULT.slice();
let TEAMS = TEAMS_DEFAULT.slice();
let F1_FIXTURE = generateF1Fixture(PLAYERS.length);
let F2_FIXTURE = F2_FIXTURE_DEFAULT.slice();

let latestState = { f1: {}, f2: {}, impostor: { rounds: [] } };
let latestRules = null;
let lastUpdate = null;
let ready = false;

// ── ESTADO DE LOS ACORDEONES (se acuerda si abriste algo, aunque la
// pantalla se vuelva a dibujar por una actualización en vivo de Firestore) ──
let _uiOpen = {};
function accOpen(key, defaultOpen) {
  return Object.prototype.hasOwnProperty.call(_uiOpen, key) ? _uiOpen[key] : !!defaultOpen;
}
function wireAccordions() {
  document.querySelectorAll('details[data-acc-key]').forEach(d => {
    d.addEventListener('toggle', () => { _uiOpen[d.dataset.accKey] = d.open; });
  });
}

function gameNameF1(idx) { return (latestRules && latestRules.f1 && latestRules.f1[idx]) ? latestRules.f1[idx].name : (GAMES_F1_DEFAULT[idx] || '?'); }
function gameNameF2(idx) { return (latestRules && latestRules.f2 && latestRules.f2[idx]) ? latestRules.f2[idx].name : (GAMES_F2_DEFAULT[idx] || '?'); }

function getPoints(type) {
  const RC = latestRules;
  const entities = type === 'f1' ? PLAYERS : TEAMS;
  const fixture = type === 'f1' ? F1_FIXTURE : F2_FIXTURE;
  const store = type === 'f1' ? (latestState.f1 || {}) : (latestState.f2 || {});
  const pts = entities.map(() => ({ total: 0, wins: 0, losses: 0 }));
  fixture.forEach(([r, a, b, g]) => {
    const res = store[r + '-' + a + '-' + b];
    if (!res) return;
    const gCfg = (RC && RC[type] && RC[type][g]) ? RC[type][g] : null;
    const winPts = gCfg ? gCfg.pts_win : 3;
    const bonusPts = gCfg ? gCfg.pts_bonus : 1;
    const drawPts = gCfg ? gCfg.pts_draw : 1;
    if (res.winner === 'empate') { pts[a].total += drawPts; pts[b].total += drawPts; }
    else {
      const w = res.winner, l = (w === a ? b : a);
      if (pts[w]) { pts[w].total += winPts + (res.bonus ? bonusPts : 0); pts[w].wins++; }
      if (pts[l]) pts[l].losses++;
    }
  });
  if (type === 'f1') {
    if (latestState.impostor && Array.isArray(latestState.impostor.rounds)) {
      const impNoPts = (RC && RC.impostor) ? RC.impostor.pts_noDescubierto : 4;
      const impDesPts = (RC && RC.impostor) ? RC.impostor.pts_descubierto : 2;
      latestState.impostor.rounds.forEach(rd => {
        const idx = PLAYERS.indexOf(rd.impostorName);
        if (idx < 0) return;
        if (rd.mode === 'noDescubierto') pts[idx].total += impNoPts;
        else if (rd.mode === 'descubierto') { const vi = PLAYERS.indexOf(rd.accusedName); if (vi >= 0) pts[vi].total += impDesPts; }
      });
    }
    // Extras (igual que en el TV): comodines, bonus manual, apuestas acertadas, ajustes manuales y vs. JC
    try {
      const bm = latestState.bonusManual || {};
      PLAYERS.forEach((n, i) => { if (bm[n] && bm[n].pts) pts[i].total += Number(bm[n].pts) || 0; });
      (latestState.comodines || []).forEach(c => { if (c.status === 'done') { const i = PLAYERS.indexOf(c.player); if (i >= 0) pts[i].total += Number(c.delta) || 0; } });
      const bets = latestState.bets || {};
      const bw = {}, bb = {};
      Object.keys(bets).forEach(k => {
        const res = latestState.f1[k];
        if (!res || res.winner === 'empate') return;
        const pp = k.split('-').map(Number);
        Object.keys(bets[k]).forEach(who => {
          const i = PLAYERS.indexOf(who);
          if (i < 0) return;
          const own = (pp[1] === i || pp[2] === i);
          if (bets[k][who] === res.winner) bw[i] = (bw[i] || 0) + 1; else if (own) bb[i] = true;
        });
      });
      Object.keys(bw).forEach(i => { if (!bb[i]) pts[i].total += bw[i]; });
      const vs = latestState.vsJC || {};
      PLAYERS.forEach((n, i) => { if (typeof vs[n] === 'number') pts[i].total += vs[n]; });
    } catch (e) {}
  } else {
    // Extras (igual que en el TV): ronda "¿Quién lo dijo?", comodines de equipo y ajustes manuales
    try {
      const qld = latestState.qldTeamPoints || {};
      Object.keys(qld).forEach(k => { const i = parseInt(k, 10); if (pts[i]) pts[i].total += Number(qld[k]) || 0; });
      (latestState.comodinesF2 || []).forEach(c => { if (c.status === 'done') { const i = TEAMS.indexOf(c.player); if (i >= 0) pts[i].total += Number(c.delta) || 0; } });
    } catch (e) {}
  }
  return pts;
}

function ranked(type) {
  const entities = type === 'f1' ? PLAYERS : TEAMS;
  const pts = getPoints(type);
  return entities.map((n, i) => ({ n, i, ...pts[i] })).sort((a, b) => b.total - a.total);
}

function teamIndexForPlayer(playerName) {
  const full = FULL_NAMES[playerName] || playerName;
  return TEAMS.findIndex(t => t.includes(full));
}

function findNextMatch(type, idx) {
  const fixture = type === 'f1' ? F1_FIXTURE : F2_FIXTURE;
  const store = type === 'f1' ? (latestState.f1 || {}) : (latestState.f2 || {});
  const entities = type === 'f1' ? PLAYERS : TEAMS;
  const mine = fixture.filter(([r, a, b]) => a === idx || b === idx);
  const pending = mine.filter(([r, a, b]) => !store[r + '-' + a + '-' + b]).sort((x, y) => x[0] - y[0]);
  if (!pending.length) return null;
  const [r, a, b, g] = pending[0];
  const oppIdx = a === idx ? b : a;
  const oppName = type === 'f1' ? entities[oppIdx].split(' ')[0] : entities[oppIdx].split('/')[0].trim();
  const game = type === 'f1' ? gameNameF1(g) : gameNameF2(g);
  return { round: r, oppName, game };
}

function findLastMatch(type, idx) {
  const fixture = type === 'f1' ? F1_FIXTURE : F2_FIXTURE;
  const store = type === 'f1' ? (latestState.f1 || {}) : (latestState.f2 || {});
  const entities = type === 'f1' ? PLAYERS : TEAMS;
  const mine = fixture.filter(([r, a, b]) => a === idx || b === idx);
  const done = mine.filter(([r, a, b]) => store[r + '-' + a + '-' + b]).sort((x, y) => y[0] - x[0]);
  if (!done.length) return null;
  const [r, a, b, g] = done[0];
  const res = store[r + '-' + a + '-' + b];
  const oppIdx = a === idx ? b : a;
  const oppName = type === 'f1' ? entities[oppIdx].split(' ')[0] : entities[oppIdx].split('/')[0].trim();
  const game = type === 'f1' ? gameNameF1(g) : gameNameF2(g);
  if (res.winner === 'empate') return { result: 'empate', oppName, game };
  const won = res.winner === idx;
  return { result: won ? 'gano' : 'perdio', oppName, game, bonus: !!res.bonus };
}

function ordinal(n) { return n + '°'; }

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── FOTOS DE PERFIL (las publica el organizador desde velada.html) ──
// Mismo documento Firestore ('ndj/photos') que arma velada.html: un mapa
// { nombre: dataURL }. Para jugadores solo (Fase 1) la clave es el apodo
// (ej. "Risu"); para integrantes de equipo (Fase 2) la clave es el nombre
// completo tal como aparece en TEAMS (ej. "Martín H."). Replicamos acá el
// mismo criterio de resolución que usa velada.html para que coincidan.
let PLAYER_PHOTOS = {};
function getPlayerPhoto(name) { return PLAYER_PHOTOS[String(name || '').trim()] || PLAYER_PHOTOS[name] || null; }
function entityMembers(name) { return String(name || '').split('/').map(s => s.trim()).filter(Boolean); }
function entityPhotos(name) {
  const parts = entityMembers(name);
  if (parts.length > 1) {
    const teamPhoto = getPlayerPhoto(name);
    return parts.map(p => getPlayerPhoto(p) || null).map((p, i) => p || (i === 0 ? teamPhoto : null));
  }
  return [getPlayerPhoto(name) || null];
}
function avatarColor(name) {
  const s = String(name || '');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return MII_COLORS[h % MII_COLORS.length];
}
function avatarFallbackHtml(name, size) {
  const initial = (String(name).trim()[0] || '?').toUpperCase();
  return `<div class="pa-fallback" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.42)}px;background:${avatarColor(name)}">${escapeHtml(initial)}</div>`;
}
// Avatar (foto real si hay, si no un círculo de color con la inicial). Para
// equipos de dos (nombre con "/") arma un dúo de avatares solapados.
function avatarHtml(name, size) {
  size = size || 28;
  const parts = entityMembers(name);
  if (parts.length > 1) {
    const s2 = Math.round(size * 0.86);
    const ph = entityPhotos(name);
    const one = (p, m) => p ? `<img class="pa-img" src="${p}" style="width:${s2}px;height:${s2}px" alt="">` : avatarFallbackHtml(m, s2);
    return `<span class="pa-duo">${one(ph[0], parts[0])}${one(ph[1], parts[1])}</span>`;
  }
  const photo = getPlayerPhoto(name);
  if (photo) return `<img class="pa-img" src="${photo}" style="width:${size}px;height:${size}px" alt="">`;
  return avatarFallbackHtml(name.split('/')[0], size);
}

// Si una tarjeta opcional falla, no debe tumbar todo el dashboard
function safeBlock(fn) { try { return fn() || ''; } catch (e) { console.warn('bloque omitido:', e); return ''; } }

// ── APUESTAS ─────────────────────────────────────────────────
// Se puede apostar en TODOS los duelos, incluido el propio.
// Cada acierto = 1 pt. Pero si apostás a tu propio duelo y lo perdés,
// se te borran todos los puntos que hayas ganado apostando.
function myBetTally(myName) {
  const bets = latestState.bets || {};
  const myIdx = PLAYERS.indexOf(myName);
  let hits = 0, misses = 0, blown = false, pending = 0;
  Object.keys(bets).forEach(key => {
    const b = bets[key][myName];
    if (typeof b !== 'number') return;
    const res = (latestState.f1 || {})[key];
    if (!res) { pending++; return; }
    if (res.winner === 'empate') return;
    const p = key.split('-').map(Number);
    const own = (p[1] === myIdx || p[2] === myIdx);
    if (res.winner === b) hits++;
    else { misses++; if (own) blown = true; }
  });
  return { hits: hits, misses: misses, blown: blown, pending: pending, net: blown ? 0 : hits };
}

function renderBetCard(myName, myIdx) {
  const bets = latestState.bets || {};
  const bw = latestState.betWindow || { open: false, round: 0 };
  const t = myBetTally(myName);

  const buildRow = m => {
    const key = m[0] + '-' + m[1] + '-' + m[2];
    const res = (latestState.f1 || {})[key];
    const own = (m[1] === myIdx || m[2] === myIdx);
    const mine = (bets[key] || {})[myName];
    const nA = String(PLAYERS[m[1]] || '?').split(' ')[0];
    const nB = String(PLAYERS[m[2]] || '?').split(' ')[0];
    const game = gameNameF1(m[3]);
    // Solo se puede apostar la ronda que el conductor tenga abierta
    const bettable = bw.open && m[0] === bw.round && !res;

    if (res) {
      let mark = '<span class="gh-b-none">sin apuesta</span>';
      if (typeof mine === 'number') {
        if (res.winner === 'empate') mark = '<span class="gh-b-none">empate</span>';
        else if (res.winner === mine) mark = '<span class="gh-b-hit" aria-label="Acertaste, +1 punto">✓ +1</span>';
        else mark = own ? '<span class="gh-b-blown">✕ perdiste el tuyo</span>' : '<span class="gh-b-miss" title="No acertaste" aria-label="No acertaste">✕</span>';
      }
      const wName = res.winner === 'empate' ? 'Empate' : String(PLAYERS[res.winner] || '?').split(' ')[0];
      return `<div class="gh-b-row done${own ? ' own' : ''}">
        <div class="gh-b-info"><span class="gh-b-vs">${escapeHtml(nA)} vs ${escapeHtml(nB)}</span>
        <span class="gh-b-game">R${m[0]} · ${escapeHtml(game)} · ganó ${escapeHtml(wName)}</span></div>
        <div class="gh-b-mark">${mark}</div>
      </div>`;
    }

    if (!bettable) {
      const why = typeof mine === 'number'
        ? '<span class="gh-b-locked">🔒 ' + escapeHtml(String(PLAYERS[mine] || '').split(' ')[0]) + '</span>'
        : '<span class="gh-b-locked">🔒</span>';
      return `<div class="gh-b-row locked${own ? ' own' : ''}">
        <div class="gh-b-info"><span class="gh-b-vs">${escapeHtml(nA)} vs ${escapeHtml(nB)}</span>
        <span class="gh-b-game">R${m[0]} · ${escapeHtml(game)}${own ? ' · <b>tu duelo</b>' : ''}</span></div>
        <div class="gh-b-mark">${why}</div>
      </div>`;
    }

    const btn = (idx, nm) => `<button class="gh-b-opt${mine === idx ? ' picked' : ''}" data-key="${key}" data-bet="${idx}">${escapeHtml(nm)}</button>`;
    return `<div class="gh-b-row${own ? ' own' : ''}">
      <div class="gh-b-info"><span class="gh-b-vs">${escapeHtml(nA)} vs ${escapeHtml(nB)}</span>
      <span class="gh-b-game">R${m[0]} · ${escapeHtml(game)}${own ? ' · <b>tu duelo</b>' : ''}</span></div>
      <div class="gh-b-opts">${btn(m[1], nA)}${btn(m[2], nB)}</div>
    </div>`;
  };

  // Los duelos de la ronda abierta van siempre visibles y primero: son los
  // únicos en los que realmente se puede apostar ahora. El resto (jugados
  // o todavía bloqueados) queda colapsado debajo, para no obligar a
  // scrollear entre 30 duelos para encontrar dónde apostar.
  const fixture = F1_FIXTURE || [];
  const openMatches = bw.open ? fixture.filter(m => m[0] === bw.round) : [];
  const restMatches = bw.open ? fixture.filter(m => m[0] !== bw.round) : fixture;

  const openRows = openMatches.map(buildRow).join('');
  const restRows = restMatches.map(buildRow).join('');

  const banner = bw.open
    ? `<div class="gh-b-window open">🔓 Apuestas abiertas · <b>Ronda ${bw.round}</b></div>`
    : `<div class="gh-b-window">🔒 Apuestas cerradas — esperá a que el conductor las abra</div>`;

  const resume = t.blown
    ? `<div class="gh-b-summary blown">💥 Apostaste a tu propio duelo y lo perdiste: se te anularon ${t.hits} punto${t.hits === 1 ? '' : 's'}.</div>`
    : `<div class="gh-b-summary">Aciertos: <b>${t.hits}</b> · Puntos ganados: <b>+${t.net}</b>${t.pending ? ' · ' + t.pending + ' pendiente' + (t.pending === 1 ? '' : 's') : ''}</div>`;

  const restSection = restMatches.length
    ? `<details class="gh-toggle-wrap" data-acc-key="bets-rest-f1"${accOpen('bets-rest-f1', false) ? ' open' : ''}>
        <summary class="gh-toggle">
          <span class="card-label">Ver duelos anteriores</span><span class="gh-toggle-arrow">▶</span>
        </summary>
        <div class="gh-b-list">${restRows}</div>
      </details>`
    : '';

  const badge = bw.open
    ? `<span class="gh-acc-badge on">🔓 Ronda ${bw.round}</span>`
    : `<span class="gh-acc-badge">🔒 Cerradas</span>`;
  const hint = t.blown
    ? `${t.hits} anulado${t.hits === 1 ? '' : 's'}`
    : `${t.hits} acierto${t.hits === 1 ? '' : 's'} · +${t.net} pts`;

  return `<details class="gh-acc" data-acc-key="bets-f1"${accOpen('bets-f1', bw.open) ? ' open' : ''}>
    <summary class="gh-acc-summary">
      <span class="gh-acc-summary-left">
        <span class="gh-acc-icon">🃏</span>
        <span class="gh-acc-title-wrap"><span class="gh-acc-title">Apuestas</span><span class="gh-acc-hint">${escapeHtml(hint)}</span></span>
      </span>
      <span class="gh-acc-summary-right">${badge}<span class="gh-acc-chevron" aria-hidden="true">▶</span></span>
    </summary>
    <div class="gh-acc-body">
      <div class="gh-bet-sub">Cada acierto suma <b>1 punto</b>.<br>
        ⚠️ Podés apostar a tu propio duelo, pero si lo perdés <b>se te borran todos los puntos de apuestas</b>.</div>
      ${banner}
      ${resume}
      <div class="gh-b-list">${openRows || '<div class="gh-b-none" style="padding:0.6rem 0">Todavía no hay duelos para apostar en esta ronda.</div>'}</div>
      ${restSection}
      <div class="gh-bet-status" id="gh-bet-status"></div>
    </div>
  </details>`;
}

function wireBetCard(myName, myIdx) {
  document.querySelectorAll('.gh-b-opt').forEach(b => {
    b.addEventListener('click', async () => {
      const key  = b.getAttribute('data-key');
      const pick = Number(b.getAttribute('data-bet'));
      const row  = b.closest('.gh-b-row');
      const status = document.getElementById('gh-bet-status');
      // Revalidar por si el conductor cerró las apuestas mientras tanto
      const bw = latestState.betWindow || { open: false, round: 0 };
      const kr = Number(String(key).split('-')[0]);
      if (!bw.open || kr !== bw.round) {
        if (status) status.textContent = '🔒 Las apuestas de esa ronda están cerradas.';
        render();
        return;
      }
      if (row) row.querySelectorAll('.gh-b-opt').forEach(x => x.classList.remove('picked'));
      b.classList.add('picked');
      if (status) status.textContent = 'Guardando…';
      try {
        let all = {};
        try {
          const snap = await getDoc(doc(db, 'ndj', 'bets'));
          if (snap.exists()) { const o = JSON.parse(snap.data().data); if (o && typeof o === 'object') all = o; }
        } catch (e) {}
        all[key] = all[key] || {};
        all[key][myName] = pick;
        await setDoc(doc(db, 'ndj', 'bets'), { data: JSON.stringify(all), ts: Date.now() });
        latestState.bets = all;
        if (status) status.textContent = '✓ Apuesta guardada';
      } catch (e) {
        if (status) status.textContent = 'No se pudo guardar. Probá de nuevo.';
      }
    });
  });
}

function renderBetCardF2(myName, myTeamIdx) {
  const bets = latestState.betsF2 || {};
  const bw = latestState.betWindowF2 || { open: false, round: 0 };
  const t = myBetTallyF2(myName);

  const buildRow = m => {
    const key = m[0] + '-' + m[1] + '-' + m[2];
    const res = (latestState.f2 || {})[key];
    const own = (m[1] === myTeamIdx || m[2] === myTeamIdx);
    const mine = (bets[key] || {})[myName];
    const nA = String(TEAMS[m[1]] || '?').split('/')[0].trim();
    const nB = String(TEAMS[m[2]] || '?').split('/')[0].trim();
    const game = gameNameF2(m[3]);
    // Solo se puede apostar la ronda que el conductor tenga abierta
    const bettable = bw.open && m[0] === bw.round && !res;

    if (res) {
      let mark = '<span class="gh-b-none">sin apuesta</span>';
      if (typeof mine === 'number') {
        if (res.winner === 'empate') mark = '<span class="gh-b-none">empate</span>';
        else if (res.winner === mine) mark = '<span class="gh-b-hit" aria-label="Acertaste, +1 punto">✓ +1</span>';
        else mark = own ? '<span class="gh-b-blown">✕ perdiste el tuyo</span>' : '<span class="gh-b-miss" title="No acertaste" aria-label="No acertaste">✕</span>';
      }
      const wName = res.winner === 'empate' ? 'Empate' : String(TEAMS[res.winner] || '?').split('/')[0].trim();
      return `<div class="gh-b-row done${own ? ' own' : ''}">
        <div class="gh-b-info"><span class="gh-b-vs">${escapeHtml(nA)} vs ${escapeHtml(nB)}</span>
        <span class="gh-b-game">R${m[0]} · ${escapeHtml(game)} · ganó ${escapeHtml(wName)}</span></div>
        <div class="gh-b-mark">${mark}</div>
      </div>`;
    }

    if (!bettable) {
      const why = typeof mine === 'number'
        ? '<span class="gh-b-locked">🔒 ' + escapeHtml(String(TEAMS[mine] || '').split('/')[0].trim()) + '</span>'
        : '<span class="gh-b-locked">🔒</span>';
      return `<div class="gh-b-row locked${own ? ' own' : ''}">
        <div class="gh-b-info"><span class="gh-b-vs">${escapeHtml(nA)} vs ${escapeHtml(nB)}</span>
        <span class="gh-b-game">R${m[0]} · ${escapeHtml(game)}${own ? ' · <b>tu equipo</b>' : ''}</span></div>
        <div class="gh-b-mark">${why}</div>
      </div>`;
    }

    const btn = (idx, nm) => `<button class="gh-b-opt gh-b-opt-f2${mine === idx ? ' picked' : ''}" data-key="${key}" data-bet="${idx}">${escapeHtml(nm)}</button>`;
    return `<div class="gh-b-row${own ? ' own' : ''}">
      <div class="gh-b-info"><span class="gh-b-vs">${escapeHtml(nA)} vs ${escapeHtml(nB)}</span>
      <span class="gh-b-game">R${m[0]} · ${escapeHtml(game)}${own ? ' · <b>tu equipo</b>' : ''}</span></div>
      <div class="gh-b-opts">${btn(m[1], nA)}${btn(m[2], nB)}</div>
    </div>`;
  };

  // Mismo criterio que en Fase 1: la ronda abierta primero y siempre
  // visible, el resto colapsado debajo.
  const fixture = F2_FIXTURE || [];
  const openMatches = bw.open ? fixture.filter(m => m[0] === bw.round) : [];
  const restMatches = bw.open ? fixture.filter(m => m[0] !== bw.round) : fixture;

  const openRows = openMatches.map(buildRow).join('');
  const restRows = restMatches.map(buildRow).join('');

  const banner = bw.open
    ? `<div class="gh-b-window open">🔓 Apuestas abiertas · <b>Ronda ${bw.round}</b></div>`
    : `<div class="gh-b-window">🔒 Apuestas cerradas — esperá a que el conductor las abra</div>`;

  const resume = t.blown
    ? `<div class="gh-b-summary blown">💥 Apostaste al duelo de tu equipo y lo perdiste: se te anularon ${t.hits} punto${t.hits === 1 ? '' : 's'}.</div>`
    : `<div class="gh-b-summary">Aciertos: <b>${t.hits}</b> · Puntos ganados para tu equipo: <b>+${t.net}</b>${t.pending ? ' · ' + t.pending + ' pendiente' + (t.pending === 1 ? '' : 's') : ''}</div>`;

  const restSection = restMatches.length
    ? `<details class="gh-toggle-wrap" data-acc-key="bets-rest-f2"${accOpen('bets-rest-f2', false) ? ' open' : ''}>
        <summary class="gh-toggle">
          <span class="card-label">Ver duelos anteriores</span><span class="gh-toggle-arrow">▶</span>
        </summary>
        <div class="gh-b-list">${restRows}</div>
      </details>`
    : '';

  const badge = bw.open
    ? `<span class="gh-acc-badge on">🔓 Ronda ${bw.round}</span>`
    : `<span class="gh-acc-badge">🔒 Cerradas</span>`;
  const hint = t.blown
    ? `${t.hits} anulado${t.hits === 1 ? '' : 's'}`
    : `${t.hits} acierto${t.hits === 1 ? '' : 's'} · +${t.net} pts`;

  return `<details class="gh-acc info" data-acc-key="bets-f2"${accOpen('bets-f2', bw.open) ? ' open' : ''}>
    <summary class="gh-acc-summary">
      <span class="gh-acc-summary-left">
        <span class="gh-acc-icon">🃏</span>
        <span class="gh-acc-title-wrap"><span class="gh-acc-title">Apuestas · Fase 2</span><span class="gh-acc-hint">${escapeHtml(hint)}</span></span>
      </span>
      <span class="gh-acc-summary-right">${badge}<span class="gh-acc-chevron" aria-hidden="true">▶</span></span>
    </summary>
    <div class="gh-acc-body">
      <div class="gh-bet-sub">Cada acierto suma <b>1 punto a tu equipo</b>.<br>
        ⚠️ Podés apostar al duelo de tu propio equipo, pero si lo perdés <b>se le borran todos los puntos de apuestas a tu equipo</b>.</div>
      ${banner}
      ${resume}
      <div class="gh-b-list">${openRows || '<div class="gh-b-none" style="padding:0.6rem 0">Todavía no hay duelos para apostar en esta ronda.</div>'}</div>
      ${restSection}
      <div class="gh-bet-status" id="gh-bet-status-f2"></div>
    </div>
  </details>`;
}

function wireBetCardF2(myName) {
  document.querySelectorAll('.gh-b-opt-f2').forEach(b => {
    b.addEventListener('click', async () => {
      const key  = b.getAttribute('data-key');
      const pick = Number(b.getAttribute('data-bet'));
      const row  = b.closest('.gh-b-row');
      const status = document.getElementById('gh-bet-status-f2');
      // Revalidar por si el conductor cerró las apuestas mientras tanto
      const bw = latestState.betWindowF2 || { open: false, round: 0 };
      const kr = Number(String(key).split('-')[0]);
      if (!bw.open || kr !== bw.round) {
        if (status) status.textContent = '🔒 Las apuestas de esa ronda están cerradas.';
        render();
        return;
      }
      if (row) row.querySelectorAll('.gh-b-opt-f2').forEach(x => x.classList.remove('picked'));
      b.classList.add('picked');
      if (status) status.textContent = 'Guardando…';
      try {
        let all = {};
        try {
          const snap = await getDoc(doc(db, 'ndj', 'betsF2'));
          if (snap.exists()) { const o = JSON.parse(snap.data().data); if (o && typeof o === 'object') all = o; }
        } catch (e) {}
        all[key] = all[key] || {};
        all[key][myName] = pick;
        await setDoc(doc(db, 'ndj', 'betsF2'), { data: JSON.stringify(all), ts: Date.now() });
        latestState.betsF2 = all;
        if (status) status.textContent = '✓ Apuesta guardada';
      } catch (e) {
        if (status) status.textContent = 'No se pudo guardar. Probá de nuevo.';
      }
    });
  });
}

// ── MURO DE FOTOS: subida desde el celular ───────────────────
const WALL_MAX_GUEST = 40;
const WALL_FB_BUDGET_GUEST = 700000; // ~700 KB, con margen bajo el límite de 1 MB

// Deja el muro dentro del presupuesto descartando las fotos más viejas.
// Devuelve el JSON listo para subir y cuántas se tuvieron que sacar.
function wallWithinBudget(list) {
  let arr = list.slice();
  let json = JSON.stringify(arr);
  let dropped = 0;
  while (json.length > WALL_FB_BUDGET_GUEST && arr.length > 1) {
    arr = arr.slice(1);
    dropped++;
    json = JSON.stringify(arr);
  }
  return { arr, json, dropped };
}
function compressPhotoGuest(file) {
  return new Promise((resolve) => {
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        const MAX = 520;
        const scale = Math.min(1, MAX / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.55));
      };
      img.onerror = () => resolve(null);
      img.src = e.target.result;
    };
    r.onerror = () => resolve(null);
    r.readAsDataURL(file);
  });
}
function pickAndUploadPhotos(myName) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.multiple = true;
  inp.onchange = async () => {
    const files = Array.from(inp.files || []);
    if (!files.length) return;
    const status = document.getElementById('gh-wall-status');
    const setStatus = (t, ok) => { if (status) { status.textContent = t; status.className = 'gh-wall-status' + (ok ? ' ok' : ''); } };
    setStatus('Comprimiendo…', false);
    try {
      const shots = [];
      for (const f of files) {
        const d = await compressPhotoGuest(f);
        if (d) shots.push({ id: 'w' + Date.now() + Math.floor(Math.random() * 9999), src: d, by: myName, ts: Date.now() });
      }
      if (!shots.length) { setStatus('No se pudo leer las fotos', false); return; }
      setStatus('Subiendo…', false);
      // Merge con lo que ya haya para no pisar las fotos de los demás
      let wall = [];
      try {
        const snap = await getDoc(doc(db, 'ndj', 'wall'));
        if (snap.exists()) { const arr = JSON.parse(snap.data().data); if (Array.isArray(arr)) wall = arr; }
      } catch (e) {}
      wall = wall.concat(shots).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      if (wall.length > WALL_MAX_GUEST) wall = wall.slice(-WALL_MAX_GUEST);
      const fit = wallWithinBudget(wall);
      await setDoc(doc(db, 'ndj', 'wall'), { data: fit.json, ts: Date.now() });
      setStatus(
        '✓ ' + shots.length + ' foto(s) subida(s)' +
        (fit.dropped ? ' · se archivaron ' + fit.dropped + ' de las más viejas por espacio' : ''),
        true
      );
    } catch (e) {
      console.warn('muro:', e);
      setStatus('No se pudo subir. Probá con menos fotos o de a una.', false);
    }
  };
  inp.click();
}

function shortName(n, isF1) { return isF1 ? String(n).split(' ')[0] : String(n).split('/')[0].trim().split(' ')[0]; }

// ── EN VIVO: relator, resultados y logros (misma lógica del modo TV,
// reutilizando el mismo estado y las mismas funciones que la pestaña "Yo") ──
let evPhase = 'f1';

function detectLogros() {
  const found = [];
  const add = (id, emoji, title, who, desc) => found.push({ id, emoji, title, who, desc });
  const state = latestState;

  const f1Seq = [];
  F1_FIXTURE.forEach(m => {
    const k = m[0] + '-' + m[1] + '-' + m[2];
    const res = (state.f1 || {})[k];
    if (res) f1Seq.push({ key: k, a: m[1], b: m[2], res });
  });

  if (f1Seq.length) {
    const first = f1Seq.find(x => x.res.winner !== 'empate');
    if (first) { const w = PLAYERS[first.res.winner]; if (w) add('primera-sangre', '💥', 'Primera Sangre', w, 'Ganó el primer duelo de la noche'); }
  }
  const streaks = {};
  f1Seq.forEach(x => {
    if (x.res.winner === 'empate') { streaks[PLAYERS[x.a]] = 0; streaks[PLAYERS[x.b]] = 0; return; }
    const w = PLAYERS[x.res.winner], l = PLAYERS[x.res.winner === x.a ? x.b : x.a];
    streaks[w] = (streaks[w] || 0) + 1; streaks[l] = 0;
    if (streaks[w] === 2) add('doblete-' + w, '⚡', 'Doblete', w, 'Dos victorias al hilo');
    if (streaks[w] === 3) add('triplete-' + w, '🔥', 'Triplete', w, 'Tres victorias seguidas');
    if (streaks[w] === 4) add('imparable-' + w, '🚀', 'Imparable', w, 'Cuatro victorias sin perder');
    if (x.res.bonus) add('bonus-' + x.key, '⭐', 'Con Estilo', w, 'Ganó con bonus incluido');
  });
  try {
    const pts = getPoints('f1');
    if (pts.length) {
      const sorted = PLAYERS.map((n, i) => ({ n, t: pts[i] ? pts[i].total : 0 })).sort((a, b) => a.t - b.t);
      const lastName = sorted.length ? sorted[0].n : null;
      const lastWin = f1Seq.slice().reverse().find(x => x.res.winner !== 'empate' && PLAYERS[x.res.winner] === lastName);
      if (lastName && lastWin) add('superviviente-' + lastWin.key, '🧟', 'Superviviente', lastName, 'Ganó estando último en la tabla');
    }
  } catch (e) {}
  try {
    (((state.impostor || {}).rounds) || []).forEach((rd, i) => {
      if (!rd || !rd.impostorName) return;
      if (rd.mode === 'noDescubierto') add('villano-' + i, '😈', 'El Villano', rd.impostorName, 'Fue impostor y nadie lo descubrió');
      else add('cazador-' + i, '🔍', 'Cazado', rd.impostorName, 'Lo descubrieron como impostor');
    });
  } catch (e) {}
  try {
    const f2Seq = [];
    F2_FIXTURE.forEach(m => { const k = m[0] + '-' + m[1] + '-' + m[2]; if ((state.f2 || {})[k]) f2Seq.push({ key: k, a: m[1], b: m[2], res: state.f2[k] }); });
    const tstreaks = {};
    f2Seq.forEach(x => {
      if (x.res.winner === 'empate') { tstreaks[TEAMS[x.a]] = 0; tstreaks[TEAMS[x.b]] = 0; return; }
      const w = TEAMS[x.res.winner], l = TEAMS[x.res.winner === x.a ? x.b : x.a];
      tstreaks[w] = (tstreaks[w] || 0) + 1; tstreaks[l] = 0;
      if (tstreaks[w] === 2) add('duo-doblete-' + w, '🤝', 'Dupla Encendida', w, 'Dos victorias seguidas en equipo');
      if (tstreaks[w] === 3) add('duo-triplete-' + w, '🏆', 'Dupla Imparable', w, 'Tres victorias al hilo');
    });
  } catch (e) {}
  try {
    (state.comodines || []).forEach(c => {
      if (c.status !== 'done') return;
      if (c.key === 'robo') add('ladron-' + c.id, '🥷', 'Ladrón', c.player, c.note || 'Le robó un punto a otro');
      if (c.key === 'peaje') add('peaje-' + c.id, '💸', 'Mala Racha', c.player, 'La ruleta le sacó un punto');
    });
    (state.comodinesF2 || []).forEach(c => {
      if (c.status !== 'done') return;
      if (c.key === 'robo') add('ladron-eq-' + c.id, '🥷', 'Ladrón', c.player, c.note || 'Le robó un punto a otro equipo');
      if (c.key === 'peaje') add('peaje-eq-' + c.id, '💸', 'Mala Racha', c.player, 'La ruleta le sacó un punto');
    });
  } catch (e) {}
  return found;
}

function buildRelatorLines() {
  const out = [];
  const push = (id, emoji, html) => out.push({ id, emoji, html });
  const state = latestState;
  let ppts = [], tpts = [];
  try { ppts = getPoints('f1'); } catch (e) {}
  try { tpts = getPoints('f2'); } catch (e) {}

  if (ppts.length) {
    const sortedP = PLAYERS.map((n, i) => ({ n, t: ppts[i] ? ppts[i].total : 0 })).sort((a, b) => b.t - a.t);
    if (sortedP.length >= 2 && sortedP[0].t > 0) {
      const gap = sortedP[0].t - sortedP[1].t;
      if (gap === 0) push('tie-f1-' + sortedP[0].t, '⚖️', '<b>' + shortName(sortedP[0].n, true) + '</b> y <b>' + shortName(sortedP[1].n, true) + '</b> empatados en la punta con ' + sortedP[0].t);
      else if (gap >= 5) push('lead-f1-' + sortedP[0].n + '-' + gap, '👑', '<b>' + shortName(sortedP[0].n, true) + '</b> se escapa: ' + gap + ' puntos de ventaja');
      else push('close-f1-' + sortedP[0].n + '-' + gap, '🎯', '<b>' + shortName(sortedP[0].n, true) + '</b> puntero por ' + gap + ' — ' + shortName(sortedP[1].n, true) + ' lo persigue');
    }
  }
  if (tpts.length && TEAMS.length) {
    const sortedT = TEAMS.map((n, i) => ({ n, t: tpts[i] ? tpts[i].total : 0 })).sort((a, b) => b.t - a.t);
    if (sortedT.length && sortedT[0].t > 0) {
      push('lead-f2-' + sortedT[0].n + '-' + sortedT[0].t, '🏆', '<b>' + sortedT[0].n + '</b> manda en la Fase Grupal con ' + sortedT[0].t + ' puntos');
      if (sortedT.length >= 2 && sortedT[0].t - sortedT[1].t <= 1) push('close-f2-' + sortedT[1].n, '🔥', '<b>' + sortedT[1].n + '</b> a un suspiro de la punta');
    }
  }
  try {
    const f1Done = F1_FIXTURE.filter(m => (state.f1 || {})[m[0] + '-' + m[1] + '-' + m[2]]).length;
    const f2Done = F2_FIXTURE.filter(m => (state.f2 || {})[m[0] + '-' + m[1] + '-' + m[2]]).length;
    if (f1Done && f1Done === F1_FIXTURE.length) push('f1-done', '✅', 'Fase Individual completa — se viene el Impostor');
    else if (f1Done && F1_FIXTURE.length - f1Done <= 2) push('f1-almost-' + f1Done, '⏳', 'Quedan ' + (F1_FIXTURE.length - f1Done) + ' duelos para cerrar la Fase Individual');
    if (f2Done && f2Done === F2_FIXTURE.length) push('f2-done', '✅', 'Fase Grupal completa — a la gran final');
    else if (f2Done && F2_FIXTURE.length - f2Done <= 2) push('f2-almost-' + f2Done, '⏳', 'Quedan ' + (F2_FIXTURE.length - f2Done) + ' duelos de Fase Grupal');
  } catch (e) {}
  try {
    const rounds = ((state.impostor || {}).rounds) || [];
    if (rounds.length) {
      const last = rounds[rounds.length - 1];
      if (last && last.impostorName) push('imp-' + rounds.length, last.mode === 'noDescubierto' ? '🕵️' : '🎭',
        last.mode === 'noDescubierto' ? '<b>' + shortName(last.impostorName, true) + '</b> fue impostor y nadie se dio cuenta' : 'Descubrieron a <b>' + shortName(last.impostorName, true) + '</b> como impostor');
    }
  } catch (e) {}
  try {
    const comos = (state.comodines || []).filter(c => c.status === 'done');
    if (comos.length) { const last = comos[comos.length - 1]; const d = last.delta || 0; push('como-' + last.id, d >= 0 ? '🍀' : '💀', '<b>' + shortName(last.player, true) + '</b>: ' + (last.note || 'comodín aplicado') + ' (' + (d > 0 ? '+' : '') + d + ')'); }
    const comosF2 = (state.comodinesF2 || []).filter(c => c.status === 'done');
    if (comosF2.length) { const last = comosF2[comosF2.length - 1]; const d = last.delta || 0; push('como-eq-' + last.id, d >= 0 ? '🍀' : '💀', '<b>' + last.player + '</b>: ' + (last.note || 'comodín aplicado') + ' (' + (d > 0 ? '+' : '') + d + ')'); }
  } catch (e) {}
  return out;
}

let _relatorSeen = {};
let _relatorTimer = null;
function tickRelator() {
  const txt = document.getElementById('gh-relator-txt');
  if (!txt) return;
  const lines = buildRelatorLines();
  if (!lines.length) { txt.classList.remove('fade'); txt.innerHTML = '<span class="gh-relator-empty">Todavía no hay novedades para contar…</span>'; return; }
  const fresh = lines.filter(l => !_relatorSeen[l.id]);
  const pool = fresh.length ? fresh : lines;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  _relatorSeen[pick.id] = true;
  const keys = Object.keys(_relatorSeen);
  if (keys.length > 60) keys.slice(0, 30).forEach(k => delete _relatorSeen[k]);
  txt.classList.add('fade');
  setTimeout(() => {
    txt.innerHTML = pick.html;
    const emojiEl = document.getElementById('gh-relator-emoji');
    if (emojiEl) emojiEl.textContent = pick.emoji;
    txt.classList.remove('fade');
  }, 350);
}

// Resultados: junta los duelos jugados de ambas fases. Si un duelo no
// aparece en la fixture (porque cambió el roster), no se inventa un
// nombre de juego con "?": directamente se omite ese dato.
function buildResultsFeed() {
  const items = [];
  const state = latestState;
  Object.entries(state.f1 || {}).forEach(([k, res]) => {
    const [r, a, b] = k.split('-').map(Number);
    const match = F1_FIXTURE.find(m => m[0] === r && m[1] === a && m[2] === b);
    items.push({ f2: false, r, a, b, res, game: match ? gameNameF1(match[3]) : null });
  });
  Object.entries(state.f2 || {}).forEach(([k, res]) => {
    const [r, a, b] = k.split('-').map(Number);
    const match = F2_FIXTURE.find(m => m[0] === r && m[1] === a && m[2] === b);
    items.push({ f2: true, r, a, b, res, game: match ? gameNameF2(match[3]) : null });
  });
  return items.reverse();
}

function renderVivo() {
  const root = document.getElementById('vivo-app');
  if (!root) return;
  const isF1 = evPhase === 'f1';
  const entities = isF1 ? PLAYERS : TEAMS;
  const fixture = isF1 ? F1_FIXTURE : F2_FIXTURE;
  const list = ranked(evPhase);
  const done = fixture.filter(m => (isF1 ? (latestState.f1 || {}) : (latestState.f2 || {}))[m[0] + '-' + m[1] + '-' + m[2]]).length;
  const pct = fixture.length ? Math.round((done / fixture.length) * 100) : 0;

  const top3 = list.slice(0, 3);
  const rest = list.slice(3);
  const podHtml = top3.map((e, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉';
    return `<div class="gh-pod-row p${i + 1}">
      <span class="gh-pod-medal">${medal}</span>
      <span class="gh-pod-name">${avatarHtml(e.n, 30)}<span>${escapeHtml(isF1 ? shortName(e.n, true) : e.n)}</span></span>
      <span class="gh-pod-pts">${e.total}</span>
    </div>`;
  }).join('');

  const restHtml = rest.map((e, i) => `
    <tr><td class="pos">${ordinal(i + 4)}</td>
    <td><span class="ranking-name">${avatarHtml(e.n, 22)}<span>${escapeHtml(isF1 ? shortName(e.n, true) : e.n)}</span></span></td>
    <td class="pts">${e.total}</td></tr>`).join('');

  // Cada fila de resultado usa las mismas clases que "Próximo/Último resultado"
  // en la pestaña Yo, para que el texto nunca quede pegado ni descuadrado.
  const resultsFeed = buildResultsFeed();
  const resultsHtml = resultsFeed.length ? resultsFeed.map(it => {
    const ents = it.f2 ? TEAMS : PLAYERS;
    const nameA = shortName(ents[it.a] || '?', !it.f2);
    const nameB = shortName(ents[it.b] || '?', !it.f2);
    const tagParts = ['R' + it.r];
    if (it.game) tagParts.push(it.game);
    if (it.f2) tagParts.push('Fase 2');
    const tag = escapeHtml(tagParts.join(' · '));
    if (it.res.winner === 'empate') {
      return `<div class="gh-match"><span class="gh-match-icon">🤝</span><div class="gh-match-text"><span class="gh-match-tag">${tag}</span>${escapeHtml(nameA)} vs ${escapeHtml(nameB)} — empate</div></div>`;
    }
    const winner = shortName(ents[it.res.winner] || '?', !it.f2);
    const loser = it.res.winner === it.a ? nameB : nameA;
    return `<div class="gh-match"><span class="gh-match-icon">⚡</span><div class="gh-match-text"><span class="gh-match-tag">${tag}</span><b>${escapeHtml(winner)}</b> venció a ${escapeHtml(loser)}${it.res.bonus ? ' · +bonus' : ''}</div></div>`;
  }).join('') : `<div class="gh-empty">Todavía no hay resultados cargados.</div>`;

  const logros = detectLogros().reverse();
  const logrosHtml = logros.length ? logros.slice(0, 25).map(l => `
    <div class="gh-logro-row"><span class="gh-logro-emoji">${l.emoji}</span>
      <div class="gh-logro-text"><span class="gh-logro-title">${escapeHtml(l.title)}</span><span class="gh-logro-who">${escapeHtml(l.who)}</span><span class="gh-logro-desc">${escapeHtml(l.desc)}</span></div>
    </div>`).join('') : `<div class="gh-empty">Todavía no se desbloqueó nada.</div>`;

  const updatedTxt = lastUpdate ? lastUpdate.toLocaleTimeString('es-AR') : '—';

  root.innerHTML = `
    <div class="gh-header">
      <div class="gh-eyebrow">🎮 La Velada del Año</div>
      <div class="gh-title">En vivo</div>
    </div>

    <div class="gh-relator"><span class="gh-relator-emoji" id="gh-relator-emoji">📣</span><span class="gh-relator-txt" id="gh-relator-txt">Cargando novedades…</span></div>

    <div class="gh-seg">
      <button class="gh-seg-btn ${isF1 ? 'active' : ''}" data-phase="f1">Fase 1 · Individual</button>
      <button class="gh-seg-btn f2 ${!isF1 ? 'active' : ''}" data-phase="f2">Fase 2 · Equipos</button>
    </div>

    <div class="card ${isF1 ? '' : 'f2'}">
      <div class="card-head"><span class="card-label ${isF1 ? 'accent-label' : ''}">Podio</span></div>
      <div class="gh-podium">${podHtml || `<div class="gh-empty">Todavía no hay resultados.</div>`}</div>
      <div class="gh-progress-label"><span>Duelos jugados</span><b>${done}/${fixture.length}</b></div>
      <div class="gh-progress-bar"><div class="gh-progress-fill" style="width:${pct}%"></div></div>
      ${rest.length ? `
      <details class="gh-toggle-wrap" data-acc-key="vivo-rank-${evPhase}"${accOpen('vivo-rank-' + evPhase, false) ? ' open' : ''}>
        <summary class="gh-toggle">
          <span class="card-label">Ver tabla completa</span><span class="gh-toggle-arrow">▶</span>
        </summary>
        <table class="ranking"><tbody>${restHtml}</tbody></table>
      </details>` : ''}
    </div>

    <details class="gh-acc" data-acc-key="vivo-results"${accOpen('vivo-results', false) ? ' open' : ''}>
      <summary class="gh-acc-summary">
        <span class="gh-acc-summary-left">
          <span class="gh-acc-icon">📰</span>
          <span class="gh-acc-title-wrap"><span class="gh-acc-title">Resultados</span><span class="gh-acc-hint">Últimos duelos jugados</span></span>
        </span>
        <span class="gh-acc-summary-right"><span class="gh-acc-chevron" aria-hidden="true">▶</span></span>
      </summary>
      <div class="gh-acc-body"><div class="gh-b-list">${resultsHtml}</div></div>
    </details>

    <details class="gh-acc" data-acc-key="vivo-logros"${accOpen('vivo-logros', false) ? ' open' : ''}>
      <summary class="gh-acc-summary">
        <span class="gh-acc-summary-left">
          <span class="gh-acc-icon">🏅</span>
          <span class="gh-acc-title-wrap"><span class="gh-acc-title">Logros</span><span class="gh-acc-hint">${logros.length} desbloqueados</span></span>
        </span>
        <span class="gh-acc-summary-right"><span class="gh-acc-chevron" aria-hidden="true">▶</span></span>
      </summary>
      <div class="gh-acc-body">${logrosHtml}</div>
    </details>

    <div class="gh-footer"><span class="gh-dot"></span>En vivo · actualizado ${updatedTxt}</div>
  `;

  root.querySelectorAll('.gh-seg-btn').forEach(btn => {
    btn.addEventListener('click', () => { evPhase = btn.dataset.phase; renderVivo(); });
  });
  wireAccordions();
}

let _relatorTimerStarted = false;
function startRelator() {
  if (_relatorTimerStarted) return;
  _relatorTimerStarted = true;
  tickRelator();
  _relatorTimer = setInterval(tickRelator, 6500);
}

function render() {
  if (!ready) { document.getElementById('app').innerHTML = '<div class="gh-loading">Cargando…</div>'; return; }
  const who = localStorage.getItem('ndj_guest_who');
  const tabbar = document.getElementById('tabbar');
  if (who && PLAYERS.includes(who)) {
    tabbar.classList.remove('hidden');
    renderDashboard(who);
    renderVivo();
    startRelator();
  } else {
    tabbar.classList.add('hidden');
    renderSelection();
  }
}

// ── Firebase: solo lectura, en vivo ──────────────────────────
onSnapshot(doc(db, 'ndj', 'state'), (snap) => {
  if (snap.exists()) {
    try {
      const raw = snap.data().data;
      const parsed = Object.assign({ f1: {}, f2: {}, impostor: { rounds: [] } }, JSON.parse(raw));
      latestState = parsed;
      if (parsed.playersSnapshot) { PLAYERS = parsed.playersSnapshot.slice(); F1_FIXTURE = generateF1Fixture(PLAYERS.length); }
      if (parsed.teamsSnapshot) TEAMS = parsed.teamsSnapshot.slice();
      if (parsed.f1FixtureSnapshot) F1_FIXTURE = parsed.f1FixtureSnapshot.fixture;
      if (parsed.f2FixtureSnapshot) F2_FIXTURE = parsed.f2FixtureSnapshot.fixture;
    } catch (e) { console.warn('Error al parsear estado:', e); }
  }
  lastUpdate = new Date();
  ready = true;
  render();
}, (err) => {
  console.warn('Firebase onSnapshot error (state):', err);
  document.getElementById('app').innerHTML = '<div class="gh-loading">No se pudo conectar. Revisá tu conexión a internet.</div>';
});

// Apuestas en vivo: las escriben los propios invitados, no vienen en `state`
onSnapshot(doc(db, 'ndj', 'bets'), (snap) => {
  if (!snap.exists()) return;
  try {
    const o = JSON.parse(snap.data().data);
    if (o && typeof o === 'object') { latestState.bets = o; if (ready) render(); }
  } catch (e) {}
}, () => {});

// Apuestas de Fase 2 en vivo (equipos)
onSnapshot(doc(db, 'ndj', 'betsF2'), (snap) => {
  if (!snap.exists()) return;
  try {
    const o = JSON.parse(snap.data().data);
    if (o && typeof o === 'object') { latestState.betsF2 = o; if (ready) render(); }
  } catch (e) {}
}, () => {});

onSnapshot(doc(db, 'ndj', 'rules'), (snap) => {
  if (snap.exists()) {
    try { latestRules = JSON.parse(snap.data().data); } catch (e) { console.warn('Error al parsear reglas:', e); }
    render();
  }
}, (err) => console.warn('Firebase onSnapshot error (rules):', err));

// Fotos de perfil publicadas desde velada.html
onSnapshot(doc(db, 'ndj', 'photos'), (snap) => {
  if (!snap.exists()) return;
  try {
    const o = JSON.parse(snap.data().data);
    if (o && typeof o === 'object') { PLAYER_PHOTOS = o; if (ready) render(); }
  } catch (e) { console.warn('Error al parsear fotos:', e); }
}, (err) => console.warn('Firebase onSnapshot error (photos):', err));
