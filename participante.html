<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0efe8;
    --muted: #888;
    --accent: #c8f060;
    --accent-dim: rgba(200,240,96,0.12);
    --gold: #f5c842;
    --gold-dim: rgba(245,200,66,0.12);
    --silver: #a0b4c8;
    --silver-dim: rgba(160,180,200,0.12);
    --danger: #ff5f5f;
    --success: #4ecb7e;
    --info: #60b4f0;
    --info-dim: rgba(96,180,240,0.12);
    --radius: 10px;
    --radius-lg: 16px;
  }
  html { background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    font-size: 14px;
    line-height: 1.5;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 1.5rem) env(safe-area-inset-left);
  }
  #app { max-width: 560px; margin: 0 auto; padding: 1.25rem 1rem 0; }

  /* header */
  .gh-header { text-align: center; padding: 1rem 0 1.5rem; }
  .gh-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem; }
  .gh-title { font-size: 22px; font-weight: 800; color: var(--accent); letter-spacing: -0.02em; }

  /* selection grid */
  .gh-sel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 0.5rem; }
  .gh-sel-btn {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius-lg);
    padding: 1rem 0.5rem;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.15s, background 0.15s;
  }
  .gh-sel-btn:active, .gh-sel-btn:hover { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }

  /* cards */
  .card { background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
  .card.f2 { border-color: rgba(96,180,240,0.3); }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.9rem; }
  .card-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .card.f2 .card-label { color: var(--info); }
  .card:not(.f2) .card-label.accent-label { color: var(--accent); }

  .gh-stat-row { display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 0.75rem; }
  .gh-pts { font-size: 32px; font-weight: 800; color: var(--accent); line-height: 1; }
  .card.f2 .gh-pts { color: var(--info); }
  .gh-pts-label { font-size: 12px; color: var(--muted); }
  .gh-pos { font-size: 13px; color: var(--text); font-weight: 600; }
  .gh-record { font-size: 12px; color: var(--muted); margin-bottom: 0.5rem; }
  .gh-record .win { color: var(--success); font-weight: 700; }
  .gh-record .lose { color: var(--danger); font-weight: 700; }

  .gh-match {
    display: flex; align-items: center; gap: 0.6rem;
    background: var(--surface2); border-radius: var(--radius);
    padding: 0.65rem 0.8rem; margin-top: 0.5rem; font-size: 12.5px;
  }
  .gh-match-icon { font-size: 16px; flex-shrink: 0; }
  .gh-match-text { flex: 1; }
  .gh-match-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 0.15rem; }

  .gh-empty { font-size: 12px; color: var(--muted); font-style: italic; padding: 0.5rem 0; }

  /* ranking table */
  .gh-toggle { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
  .gh-toggle-arrow { transition: transform 0.15s; color: var(--muted); font-size: 11px; }
  .gh-toggle.open .gh-toggle-arrow { transform: rotate(90deg); }
  .ranking { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }
  .ranking th { font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 0.4rem 0.5rem; border-bottom: 0.5px solid var(--border); }
  .ranking td { padding: 0.55rem 0.5rem; border-bottom: 0.5px solid var(--border); font-size: 13px; }
  .ranking tr:last-child td { border-bottom: none; }
  .ranking tr.me td { background: var(--accent-dim); font-weight: 700; }
  .card.f2 .ranking tr.me td { background: var(--info-dim); }
  .ranking .pos { color: var(--muted); font-weight: 600; width: 28px; }
  .ranking .pts { text-align: right; font-weight: 700; color: var(--accent); }
  .card.f2 .ranking .pts { color: var(--info); }

  /* footer */
  .gh-footer { text-align: center; font-size: 11px; color: var(--muted); padding: 1rem 0 1.5rem; }
  .gh-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); margin-right: 0.35rem; animation: gh-pulse 1.4s infinite; }
  @keyframes gh-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .gh-switch { display: block; margin: 0 auto 1rem; background: transparent; border: 1px solid var(--border2); color: var(--muted); border-radius: var(--radius); padding: 0.5rem 1rem; font-size: 12px; font-weight: 600; cursor: pointer; }

  .gh-wall-card { background: var(--surface); border: 1px solid var(--border2); border-radius: 14px; padding: 1rem; margin-bottom: 1rem; text-align: center; }
  .gh-wall-title { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 0.3rem; }
  .gh-wall-sub { font-size: 11px; color: var(--muted); line-height: 1.5; margin-bottom: 0.8rem; }
  .gh-wall-btn { width: 100%; padding: 0.75rem; border-radius: 12px; border: 1.5px solid #60b4f0; background: rgba(96,180,240,0.12); color: #60b4f0; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; }
  .gh-wall-btn:active { opacity: 0.8; }
  .gh-wall-status { font-size: 11px; color: var(--muted); margin-top: 0.55rem; min-height: 14px; font-weight: 600; }
  .gh-wall-status.ok { color: #4cdb7a; }

  .gh-bet-card, .gh-mii-card { background: var(--surface); border: 1px solid var(--border2); border-radius: 14px; padding: 1rem; margin-bottom: 1rem; }
  .gh-bet-title, .gh-mii-title { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 0.3rem; }
  .gh-bet-sub, .gh-mii-sub { font-size: 11px; color: var(--muted); line-height: 1.5; margin-bottom: 0.8rem; }
  .gh-b-summary { font-size: 12px; color: var(--muted); background: var(--surface2); border-radius: 10px; padding: 0.55rem 0.7rem; margin-bottom: 0.7rem; line-height: 1.5; }
  .gh-b-summary b { color: #f5c842; }
  .gh-b-summary.blown { background: rgba(255,95,95,0.1); border: 1px solid rgba(255,95,95,0.35); color: #ff8f8f; }
  .gh-b-list { display: flex; flex-direction: column; gap: 0.4rem; max-height: 340px; overflow-y: auto; }
  .gh-b-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.6rem; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); }
  .gh-b-row.own { border-color: rgba(245,200,66,0.45); background: rgba(245,200,66,0.07); }
  .gh-b-row.done { opacity: 0.72; }
  .gh-b-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .gh-b-vs { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gh-b-game { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gh-b-game b { color: #f5c842; }
  .gh-b-opts { display: flex; gap: 0.3rem; flex-shrink: 0; }
  .gh-b-opt { padding: 0.42rem 0.6rem; border-radius: 8px; border: 1.5px solid var(--border2); background: var(--surface); color: var(--text); font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gh-b-opt.picked { border-color: #f5c842; background: rgba(245,200,66,0.16); color: #f5c842; }
  .gh-b-mark { font-size: 11px; font-weight: 800; flex-shrink: 0; }
  .gh-b-hit { color: #4cdb7a; }
  .gh-b-miss { color: #ff5f5f; }
  .gh-b-blown { color: #ff5f5f; font-size: 10px; }
  .gh-b-none { color: var(--muted); font-weight: 500; font-size: 10px; font-style: italic; }
  .gh-b-locked { color: var(--muted); font-size: 11px; font-weight: 700; }
  .gh-b-row.locked { opacity: 0.55; }
  .gh-b-window { font-size: 12px; font-weight: 700; text-align: center; padding: 0.55rem; border-radius: 10px; margin-bottom: 0.6rem; background: var(--surface2); color: var(--muted); border: 1px solid var(--border2); }
  .gh-b-window.open { background: rgba(245,200,66,0.14); border-color: #f5c842; color: #f5c842; }
  .gh-b-window b { color: inherit; }

  .gh-mii-row { display: flex; align-items: flex-start; gap: 0.6rem; margin-bottom: 0.7rem; }
  .gh-mii-row > span { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); min-width: 62px; padding-top: 0.4rem; flex-shrink: 0; }
  .gh-mii-opts { display: flex; flex-wrap: wrap; gap: 0.35rem; flex: 1; }
  .gh-mii-opt { padding: 0.4rem 0.6rem; border-radius: 9px; border: 1.5px solid var(--border2); background: var(--surface2); color: var(--text); font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .gh-mii-opt.picked { border-color: #c060e8; background: rgba(192,96,232,0.16); color: #c060e8; }
  .gh-mii-color { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .gh-mii-color.picked { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.25); }
  .gh-mii-save { width: 100%; padding: 0.7rem; border-radius: 12px; border: 1.5px solid #c060e8; background: rgba(192,96,232,0.12); color: #c060e8; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; margin-top: 0.3rem; }
  .gh-mii-status { font-size: 11px; color: var(--muted); margin-top: 0.5rem; min-height: 14px; font-weight: 600; }
  .gh-mii-status.ok { color: #4cdb7a; }
  .gh-switch:hover { color: var(--text); border-color: var(--border2); }

  .gh-loading { text-align: center; color: var(--muted); font-size: 13px; padding: 3rem 0; }

  .gh-back-link{position:fixed;top:max(0.75rem,env(safe-area-inset-top));left:max(0.75rem,env(safe-area-inset-left));z-index:99999;font-size:11px;font-weight:700;color:rgba(240,239,232,0.7);background:rgba(10,10,14,0.6);border:1px solid rgba(255,255,255,0.1);border-radius:99px;padding:0.38rem 0.85rem;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);letter-spacing:0.04em;transition:color 0.15s,border-color 0.15s;white-space:nowrap}
  .gh-back-link:hover{color:#f0efe8;border-color:rgba(255,255,255,0.25)}
</style>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, onSnapshot, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyB-1B426OH2ZYKHT1n8VVzmv0h_10186Zo",
  authDomain: "cumple-598e7.firebaseapp.com",
  projectId: "cumple-598e7",
  storageBucket: "cumple-598e7.firebasestorage.app",
  messagingSenderId: "92890914103",
  appId: "1:92890914103:web:ab78f983eee410e6eb8eb2"
};
const app = initializeApp(firebaseConfig, 'guest');
const db  = getFirestore(app);

// ── Roster / fixtures por defecto (se pisan si el organizador editó el roster) ──
const PLAYERS_DEFAULT = ['Risu','Totti','Thiago','Mica','Valentín','Laza','Lara','Martin','Cori','Flor','Tomás'];
const TEAMS_DEFAULT = [
  'Martín H. / Valentín A.',
  'Lázaro G. / Tomás P.',
  'Thiago C. / Lara M.',
  'Totti / Risu',
  'Coral O. / Florencia L.'
];
const FULL_NAMES = {
  'Risu':'Risu','Totti':'Totti','Thiago':'Thiago C.','Mica':'Micaela B.','Valentín':'Valentín A.',
  'Laza':'Lázaro G.','Lara':'Lara M.','Martin':'Martín H.','Cori':'Coral O.','Flor':'Florencia L.','Tomás':'Tomás P.'
};
const GAMES_F1_DEFAULT = ['Curling','100 Argentinos Dicen','UNO','Palabras a Tiempo','Carrera de Mentes','Spot It'];
const GAMES_F2_DEFAULT = ['Mario Party',"Time's Up",'Beer Pong','Guess Movie/Song','El Erudito','Jenga'];

// F1_FIXTURE / F2_FIXTURE: [ronda, idxA, idxB, idxJuego] — se recalcula el de F1
// si cambia la cantidad de jugadores (mismo algoritmo round-robin que la app principal).
function generateF1Fixture(n) {
  const rounds = n % 2 === 0 ? n - 1 : n;
  const hasBye = n % 2 !== 0;
  const arr = Array.from({length: n}, (_, i) => i);
  if (hasBye) arr.push(-1);
  const total = arr.length;
  const fixture = [];
  const gamesCount = GAMES_F1_DEFAULT.length;
  let gamePtr = 0;
  for (let r = 0; r < rounds; r++) {
    for (let i = 0; i < total / 2; i++) {
      const a = arr[i], b = arr[total - 1 - i];
      if (a !== -1 && b !== -1) { fixture.push([r + 1, a, b, gamePtr % gamesCount]); gamePtr++; }
    }
    const fixed = arr[0];
    const rest = arr.slice(1);
    rest.unshift(rest.pop());
    arr.splice(0, arr.length, fixed, ...rest);
  }
  return fixture;
}
const F2_FIXTURE_DEFAULT = [
  [1,0,1,0],[1,2,3,4],[1,4,5,2],
  [2,0,4,5],[2,2,3,3],[2,1,5,1],
  [3,2,4,0],[3,0,5,4],[3,1,3,2],
  [4,0,1,3],[4,3,4,1],[4,2,5,5],
  [5,3,5,0],[5,1,4,4],[5,0,2,2],
  [6,0,2,1],[6,1,3,5],[6,4,5,3],
];

let PLAYERS = PLAYERS_DEFAULT.slice();
let TEAMS = TEAMS_DEFAULT.slice();
let F1_FIXTURE = generateF1Fixture(PLAYERS.length);
let F2_FIXTURE = F2_FIXTURE_DEFAULT.slice();

let latestState = { f1: {}, f2: {}, impostor: { rounds: [] } };
let latestRules = null;
let lastUpdate = null;
let ready = false;

function gameNameF1(idx) { return (latestRules && latestRules.f1 && latestRules.f1[idx]) ? latestRules.f1[idx].name : (GAMES_F1_DEFAULT[idx] || '?'); }
function gameNameF2(idx) { return (latestRules && latestRules.f2 && latestRules.f2[idx]) ? latestRules.f2[idx].name : (GAMES_F2_DEFAULT[idx] || '?'); }

function getPoints(type) {
  const RC = latestRules;
  const entities = type === 'f1' ? PLAYERS : TEAMS;
  const fixture = type === 'f1' ? F1_FIXTURE : F2_FIXTURE;
  const store = type === 'f1' ? (latestState.f1 || {}) : (latestState.f2 || {});
  const pts = entities.map(() => ({ total: 0, wins: 0, losses: 0 }));
  fixture.forEach(([r, a, b, g]) => {
    const res = store[r + '-' + a + '-' + b];
    if (!res) return;
    const gCfg = (RC && RC[type] && RC[type][g]) ? RC[type][g] : null;
    const winPts = gCfg ? gCfg.pts_win : 3;
    const bonusPts = gCfg ? gCfg.pts_bonus : 1;
    const drawPts = gCfg ? gCfg.pts_draw : 1;
    if (res.winner === 'empate') { pts[a].total += drawPts; pts[b].total += drawPts; }
    else {
      const w = res.winner, l = (w === a ? b : a);
      if (pts[w]) { pts[w].total += winPts + (res.bonus ? bonusPts : 0); pts[w].wins++; }
      if (pts[l]) pts[l].losses++;
    }
  });
  if (type === 'f1' && latestState.impostor && Array.isArray(latestState.impostor.rounds)) {
    const impNoPts = (RC && RC.impostor) ? RC.impostor.pts_noDescubierto : 4;
    const impDesPts = (RC && RC.impostor) ? RC.impostor.pts_descubierto : 2;
    latestState.impostor.rounds.forEach(rd => {
      const idx = PLAYERS.indexOf(rd.impostorName);
      if (idx < 0) return;
      if (rd.mode === 'noDescubierto') pts[idx].total += impNoPts;
      else if (rd.mode === 'descubierto') { const vi = PLAYERS.indexOf(rd.accusedName); if (vi >= 0) pts[vi].total += impDesPts; }
    });
  }
  return pts;
}

function ranked(type) {
  const entities = type === 'f1' ? PLAYERS : TEAMS;
  const pts = getPoints(type);
  return entities.map((n, i) => ({ n, i, ...pts[i] })).sort((a, b) => b.total - a.total);
}

function teamIndexForPlayer(playerName) {
  const full = FULL_NAMES[playerName] || playerName;
  return TEAMS.findIndex(t => t.includes(full));
}

function findNextMatch(type, idx) {
  const fixture = type === 'f1' ? F1_FIXTURE : F2_FIXTURE;
  const store = type === 'f1' ? (latestState.f1 || {}) : (latestState.f2 || {});
  const entities = type === 'f1' ? PLAYERS : TEAMS;
  const mine = fixture.filter(([r, a, b]) => a === idx || b === idx);
  const pending = mine.filter(([r, a, b]) => !store[r + '-' + a + '-' + b]).sort((x, y) => x[0] - y[0]);
  if (!pending.length) return null;
  const [r, a, b, g] = pending[0];
  const oppIdx = a === idx ? b : a;
  const oppName = type === 'f1' ? entities[oppIdx].split(' ')[0] : entities[oppIdx].split('/')[0].trim();
  const game = type === 'f1' ? gameNameF1(g) : gameNameF2(g);
  return { round: r, oppName, game };
}

function findLastMatch(type, idx) {
  const fixture = type === 'f1' ? F1_FIXTURE : F2_FIXTURE;
  const store = type === 'f1' ? (latestState.f1 || {}) : (latestState.f2 || {});
  const entities = type === 'f1' ? PLAYERS : TEAMS;
  const mine = fixture.filter(([r, a, b]) => a === idx || b === idx);
  const done = mine.filter(([r, a, b]) => store[r + '-' + a + '-' + b]).sort((x, y) => y[0] - x[0]);
  if (!done.length) return null;
  const [r, a, b, g] = done[0];
  const res = store[r + '-' + a + '-' + b];
  const oppIdx = a === idx ? b : a;
  const oppName = type === 'f1' ? entities[oppIdx].split(' ')[0] : entities[oppIdx].split('/')[0].trim();
  const game = type === 'f1' ? gameNameF1(g) : gameNameF2(g);
  if (res.winner === 'empate') return { result: 'empate', oppName, game };
  const won = res.winner === idx;
  return { result: won ? 'gano' : 'perdio', oppName, game, bonus: !!res.bonus };
}

function ordinal(n) { return n + '°'; }

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── Rendering ──────────────────────────────────────────────

function renderSelection() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="gh-header">
      <div class="gh-eyebrow">🎮 La Velada del Año</div>
      <div class="gh-title">¿Quién sos?</div>
    </div>
    <div class="gh-sel-grid">
      ${PLAYERS.map(p => `<button class="gh-sel-btn" data-p="${escapeHtml(p)}">${escapeHtml(p)}</button>`).join('')}
    </div>
  `;
  app.querySelectorAll('.gh-sel-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      localStorage.setItem('ndj_guest_who', btn.dataset.p);
      render();
    });
  });
}

function renderPhaseCard(type, myIdx, myName) {
  const isF1 = type === 'f1';
  const list = ranked(type);
  const posIdx = list.findIndex(e => e.i === myIdx);
  const mine = list[posIdx];
  const next = findNextMatch(type, myIdx);
  const last = findLastMatch(type, myIdx);
  const label = isF1 ? 'Fase 1 · Individual' : 'Fase 2 · Equipos';
  const displayName = isF1 ? mine.n.split(' ')[0] : mine.n;

  let matchesHtml = '';
  if (next) {
    matchesHtml += `<div class="gh-match"><span class="gh-match-icon">⏳</span><div class="gh-match-text"><span class="gh-match-tag">Próximo · Ronda ${next.round}</span>vs. ${escapeHtml(next.oppName)} — ${escapeHtml(next.game)}</div></div>`;
  }

// Si una tarjeta opcional falla, no debe tumbar todo el dashboard
function safeBlock(fn) { try { return fn() || ''; } catch (e) { console.warn('bloque omitido:', e); return ''; } }

// ── APUESTAS ─────────────────────────────────────────────────
// Se puede apostar en TODOS los duelos, incluido el propio.
// Cada acierto = 1 pt. Pero si apostás a tu propio duelo y lo perdés,
// se te borran los puntos que hayas ganado apostando EN ESA RONDA
// (no afecta a lo ganado en otras rondas de apuestas).
function myBetTally(myName) {
  const bets = latestState.bets || {};
  const myIdx = PLAYERS.indexOf(myName);
  const rounds = {}; // ronda -> { hits, misses, blown }
  let pending = 0;
  Object.keys(bets).forEach(key => {
    const b = bets[key][myName];
    if (typeof b !== 'number') return;
    const res = (latestState.f1 || {})[key];
    if (!res) { pending++; return; }
    if (res.winner === 'empate') return;
    const p = key.split('-').map(Number);
    const round = p[0];
    const own = (p[1] === myIdx || p[2] === myIdx);
    if (!rounds[round]) rounds[round] = { hits: 0, misses: 0, blown: false };
    if (res.winner === b) rounds[round].hits++;
    else { rounds[round].misses++; if (own) rounds[round].blown = true; }
  });
  let hits = 0, misses = 0, net = 0;
  const blownRounds = [];
  Object.keys(rounds).forEach(r => {
    const rd = rounds[r];
    hits += rd.hits;
    misses += rd.misses;
    if (rd.blown) blownRounds.push(Number(r)); else net += rd.hits;
  });
  return { hits: hits, misses: misses, blown: blownRounds.length > 0, blownRounds: blownRounds, pending: pending, net: net };
}

  const roundTxt = t.blownRounds.length === 1 ? ('la ronda ' + t.blownRounds[0]) : ('las rondas ' + t.blownRounds.join(', '));
  const resume = t.blown
    ? `<div class="gh-b-summary blown">💥 Apostaste a tu propio duelo y lo perdiste en ${roundTxt}: se te anularon los puntos de esa${t.blownRounds.length === 1 ? '' : 's'} ronda${t.blownRounds.length === 1 ? '' : 's'}. Puntos ganados: <b>+${t.net}</b>${t.pending ? ' · ' + t.pending + ' pendiente' + (t.pending === 1 ? '' : 's') : ''}</div>`

    <div class="gh-bet-status" id="gh-bet-status"></div>
  </div>`;
}

    if (status) { status.textContent = 'Guardando…'; status.className = 'gh-mii-status'; }
    try { localStorage.setItem('ndj_my_mii', JSON.stringify(_myMii)); } catch(e) {}
    if (teamName) { try { localStorage.setItem('ndj_my_team_mii', JSON.stringify(_myTeamMii)); } catch(e) {} }
    try {
      let all = {};
      try {
        const snap = await getDoc(doc(db, 'ndj', 'miis'));
        if (snap.exists()) { const o = JSON.parse(snap.data().data); if (o && typeof o === 'object') all = o; }
      } catch (e) {}
      all[myName] = _myMii;
      if (teamName) all[teamName] = _myTeamMii;
      await setDoc(doc(db, 'ndj', 'miis'), { data: JSON.stringify(all), ts: Date.now() });
      if (status) { status.textContent = '✓ Guardado — mirá la pantalla grande'; status.className = 'gh-mii-status ok'; }
    } catch (e) {
      if (status) status.textContent = 'No se pudo guardar. Probá de nuevo.';
    }
  });
}

// ── MURO DE FOTOS: subida desde el celular ───────────────────
const WALL_MAX_GUEST = 40;
function compressPhotoGuest(file) {
  return new Promise((resolve) => {
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        const MAX = 720;
        const scale = Math.min(1, MAX / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.68));
      };
      img.onerror = () => resolve(null);
      img.src = e.target.result;
    };
    r.onerror = () => resolve(null);
    r.readAsDataURL(file);
  });
}
function pickAndUploadPhotos(myName) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.multiple = true;
  inp.onchange = async () => {
    const files = Array.from(inp.files || []);
    if (!files.length) return;
    const status = document.getElementById('gh-wall-status');
    const setStatus = (t, ok) => { if (status) { status.textContent = t; status.className = 'gh-wall-status' + (ok ? ' ok' : ''); } };
    setStatus('Comprimiendo…', false);
    try {
      const shots = [];
      for (const f of files) {
        const d = await compressPhotoGuest(f);
        if (d) shots.push({ id: 'w' + Date.now() + Math.floor(Math.random() * 9999), src: d, by: myName, ts: Date.now() });
      }
      if (!shots.length) { setStatus('No se pudo leer las fotos', false); return; }
      setStatus('Subiendo…', false);
      // Merge con lo que ya haya para no pisar las fotos de los demás
      let wall = [];
      try {
        const snap = await getDoc(doc(db, 'ndj', 'wall'));
        if (snap.exists()) { const arr = JSON.parse(snap.data().data); if (Array.isArray(arr)) wall = arr; }
      } catch (e) {}
      wall = wall.concat(shots).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      if (wall.length > WALL_MAX_GUEST) wall = wall.slice(-WALL_MAX_GUEST);
      await setDoc(doc(db, 'ndj', 'wall'), { data: JSON.stringify(wall), ts: Date.now() });
      setStatus('✓ ' + shots.length + ' foto(s) subida(s)', true);
    } catch (e) {
      setStatus('Error al subir. Probá de nuevo.', false);
    }
  };
  inp.click();
}

function render() {
  if (!ready) { document.getElementById('app').innerHTML = '<div class="gh-loading">Cargando…</div>'; return; }
  const who = localStorage.getItem('ndj_guest_who');
  if (who && PLAYERS.includes(who)) renderDashboard(who);
  else renderSelection();
}

// ── Firebase: solo lectura, en vivo ──────────────────────────
onSnapshot(doc(db, 'ndj', 'state'), (snap) => {
  if (snap.exists()) {
    try {
      const raw = snap.data().data;
      const parsed = Object.assign({ f1: {}, f2: {}, impostor: { rounds: [] } }, JSON.parse(raw));
      latestState = parsed;
      if (parsed.playersSnapshot) { PLAYERS = parsed.playersSnapshot.slice(); F1_FIXTURE = generateF1Fixture(PLAYERS.length); }
      if (parsed.teamsSnapshot) TEAMS = parsed.teamsSnapshot.slice();
      if (parsed.f1FixtureSnapshot) F1_FIXTURE = parsed.f1FixtureSnapshot.fixture;
      if (parsed.f2FixtureSnapshot) F2_FIXTURE = parsed.f2FixtureSnapshot.fixture;
    } catch (e) { console.warn('Error al parsear estado:', e); }
  }
  lastUpdate = new Date();
  ready = true;
  render();
}, (err) => {
  console.warn('Firebase onSnapshot error (state):', err);
  document.getElementById('app').innerHTML = '<div class="gh-loading">No se pudo conectar. Revisá tu conexión a internet.</div>';
});
